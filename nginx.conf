server {
    listen 80;
    root /srv/awill/current;

    # Cache images and fonts for 30 days
    location ~* \.(png|jpg|jpeg|webp|gif|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Hashed JS/CSS/fonts come from the shared pool that deploy.sh fills on both
    # replicas before either switches releases, so HTML from either release
    # resolves its assets on either replica. ^~ keeps the image/font regex above
    # from capturing pool fonts.
    location ^~ /assets/ {
        root /srv/awill;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache HTML — ensures new deploys are picked up immediately.
    # The exact-match blocks cover direct and fallback hits on the shells;
    # location / covers / and prerendered pages served via try_files.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /spa.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all routes handled by React.
    # index.html is the prerendered home page (served for /); every other
    # client route falls back to spa.html, the empty shell, so it never
    # flashes home markup before its own route renders.
    # $uri/index.html comes before the fallback so prerendered
    # per-post pages (dist/writing/<slug>/index.html) are served inline with a
    # 200 (link-preview bots like iMessage don't reliably follow redirects).
    # NOTE: no $uri/ clause — section roots (dist/writing/) are real directories
    # with no index.html, and $uri/ would make nginx 301 to a trailing slash and
    # then 403 the dir instead of falling through to the SPA. Dropping it lets
    # /writing and /lists render via React.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /spa.html;
    }
}
